<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Mesto</title>
    <link rel="stylesheet" href="./src/pages/index.css" />
    <link rel="stylesheet" href="./src/pages/connection.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./src/images/logo.svg"
          alt="Логотип проекта место"
          class="logo header__logo"
        />
        <button class="connection-button" type="button">Подключение</button>
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__image"></div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              class="profile__edit-button"
              type="button"
              disabled
              aria-label="Редактировать профиль"
            ></button>
            <p class="profile__description"></p>
          </div>
          <button
            class="profile__add-button"
            type="button"
            disabled
            aria-label="Добавить карточку"
          ></button>
        </section>
        <p class="request-status page__section" role="status"></p>
        <section class="places page__section">
          <ul class="places__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Mesto Russia</p>
      </footer>

      <div class="popup popup_type_edit">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Редактировать профиль</h3>
          <form class="popup__form" novalidate name="edit-profile">
            <label class="popup__label">
              <input
                type="text"
                name="user-name"
                id="user-name"
                class="popup__input popup__input_type_name"
                placeholder="Имя"
                required
                aria-describedby="user-name-error"
                minlength="2"
                maxlength="40"
                pattern="[A-Za-zА-Яа-яЁё \-]+"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
              />
              <span
                class="popup__error"
                id="user-name-error"
                aria-live="polite"
              ></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="user-description"
                id="user-description"
                class="popup__input popup__input_type_description"
                placeholder="Занятие"
                required
                aria-describedby="user-description-error"
                minlength="2"
                maxlength="200"
              />
              <span
                class="popup__error"
                id="user-description-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
            <p class="popup__request-error" role="status"></p>
          </form>
        </div>
      </div>

      <div class="popup popup_type_new-card">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Новое место</h3>
          <form class="popup__form" novalidate name="new-place">
            <label class="popup__label">
              <input
                type="text"
                name="place-name"
                id="place-name"
                class="popup__input popup__input_type_card-name"
                placeholder="Название"
                required
                aria-describedby="place-name-error"
                minlength="2"
                maxlength="30"
                pattern="[A-Za-zА-Яа-яЁё \-]+"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
              />
              <span
                class="popup__error"
                id="place-name-error"
                aria-live="polite"
              ></span>
            </label>
            <label class="popup__label">
              <input
                type="url"
                name="place-link"
                id="place-link"
                class="popup__input popup__input_type_url"
                placeholder="Ссылка на картинку"
                required
                aria-describedby="place-link-error"
              />
              <span
                class="popup__error"
                id="place-link-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Создать
            </button>
            <p class="popup__request-error" role="status"></p>
          </form>
        </div>
      </div>

      <div class="popup popup_type_image">
        <div class="popup__content popup__content_content_image">
          <button type="button" class="popup__close"></button>
          <img src="" alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <div class="popup popup_type_edit-avatar">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Обновить аватар</h3>
          <form class="popup__form" novalidate name="edit-avatar">
            <label class="popup__label">
              <input
                type="url"
                name="user-avatar"
                id="user-avatar"
                class="popup__input popup__input_type_avatar"
                placeholder="Ссылка на изображение"
                required
                aria-describedby="user-avatar-error"
              />
              <span
                class="popup__error"
                id="user-avatar-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
            <p class="popup__request-error" role="status"></p>
          </form>
        </div>
      </div>
    </div>

    <script src="./src/scripts/index.js" defer type="module"></script>

    <template id="card-template">
      <li class="places__item card">
        <img class="card__image" src="" alt="" />
        <div class="card__control">
          <button
            type="button"
            class="card__control-button card__control-button_type_info"
          ></button>
          <button
            type="button"
            class="card__control-button card__control-button_type_delete"
          ></button>
        </div>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <div class="card__likes">
            <p class="card__like-count"></p>
            <button type="button" class="card__like-button"></button>
          </div>
        </div>
      </li>
    </template>
    <div class="popup popup_type_info">
      <div class="popup__content popup__content_content_info">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Информация о карточке</h3>
        <dl class="popup__info"></dl>

        <h4 class="popup__text"></h4>
        <ul class="popup__list"></ul>
      </div>
    </div>
    <template id="popup-info-definition-template">
      <div class="popup__info-item">
        <dt class="popup__info-term"></dt>
        <dd class="popup__info-description"></dd>
      </div>
    </template>
    <template id="popup-info-user-preview-template">
      <li class="popup__list-item popup__list-item_type_badge"></li>
    </template>
    <dialog class="connection-dialog" aria-labelledby="connection-title">
      <h2 id="connection-title">Подключение к Mesto</h2>
      <p>
        Укажите личный токен и идентификатор группы из задания Практикума. Токен
        хранится только в текущей вкладке браузера.
      </p>
      <form class="connection-form">
        <label
          >Идентификатор группы<input
            name="cohort"
            required
            pattern="[a-zA-Z0-9_\-]+"
            autocomplete="off"
        /></label>
        <label
          >Личный токен<input
            name="token"
            type="password"
            required
            autocomplete="off"
        /></label>
        <p class="connection-error" role="status"></p>
        <button type="submit">Подключиться</button>
      </form>
    </dialog>
  </body>
</html>
